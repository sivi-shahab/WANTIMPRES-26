# One service account per workload (ticket 40): csi-driver-spiffe names each pod's SVID after it,
# spiffe://wantimpres26.bank/ns/wantimpres26/sa/<name>, and MTLS_ALLOW lists those IDs. No API token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata: {name: control-plane}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ai-gateway}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mcp-gateway}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: detection-svc}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: model-inference}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: token-vault}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: event-ingest}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: siem-export}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: connector-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tika}
automountServiceAccountToken: false
---
apiVersion: v1
