# MCP gateway (spec §4.8 FR-AGT-3..5, §7.2): PEP between AI agents and MCP tool servers, with its own PDP sidecar.
# Secret mcp-gateway (out of band): MCP_BASE_URL, OIDC_ISSUER, STS_CLIENT_ID, STS_CLIENT_SECRET (Keycloak client
# allowed to do token exchange for each tool server's audience), KAFKA_BROKERS, SCHEMA_REGISTRY_URL, TENANT_ID,
# TENANT_PEPPER, CONTROL_PLANE_URL, MCP_GATEWAY_TOKEN (its SHA-256 is the control-plane's MCP_GATEWAY_TOKEN_SHA256).
# ConfigMap mcp-servers (out of band): servers.json, a list of
#   {"name", "upstream", "audience", "app_id", "sanction", "region"}; agents reach each at MCP_BASE_URL/mcp/<name>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels: {app: mcp-gateway}
spec:
  # ponytail: rate limits and injection taint are per replica; one replica keeps them exact until a shared store.
  replicas: 1
  selector:
    matchLabels: {app: mcp-gateway}
  template:
    metadata:
      labels: {app: mcp-gateway, wantimpres26.bank/egress: external}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: mcp-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp-gateway
          image: registry.local/wantimpres26/mcp-gateway:dev
          imagePullPolicy: Always
          envFrom: [{secretRef: {name: mcp-gateway}}]
          env:
            - {name: MCP_SERVERS_FILE, value: /config/servers.json}
            # Event bus (ticket 41): TLS + SASL/SCRAM as mcp-gateway; files from Secret mcp-gateway-bus (out of band).
            - {name: KAFKA_SASL_USER, value: mcp-gateway}
            - {name: KAFKA_SASL_PASSWORD_FILE, value: /bus/kafka-password}
            - {name: KAFKA_CA_FILE, value: /bus/kafka-ca.crt}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: mcp-servers, mountPath: /config, readOnly: true}
            - {name: bus, mountPath: /bus, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        # PDP sidecar (FR-POL-1): verifies the Policy Service bundle signature before activating it.
        - name: opa
          image: registry.local/wantimpres26/opa:dev
          imagePullPolicy: Always
          # Ticket 47: fewer GC cycles keep the p99 of a decision under 5 ms on 1 vCPU; the soft memory limit makes
          # the GC work harder again before the 256Mi container limit.
          env:
            - {name: GOGC, value: "800"}
            - {name: GOMEMLIMIT, value: 200MiB}
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181  # only the PEP in this pod may ask for decisions
            - --diagnostic-addr=:8282
            - --config-file=/config/opa.yaml
            # Both key slots (policysvc.KeyIDs): the bundle's kid picks one, so the key rotates without a restart here.
            - --set-file=keys.wantimpres26-policy-a.key=/keys/wantimpres26-policy-a.pub
            - --set-file=keys.wantimpres26-policy-b.key=/keys/wantimpres26-policy-b.pub
            - --optimize-store-for-read-speed
          ports: [{containerPort: 8282, name: opa-diag}]
          # Not ready until a verified bundle is active: no PEP traffic on an empty policy.
          readinessProbe: {httpGet: {path: "/health?bundles", port: opa-diag}}
          livenessProbe: {httpGet: {path: /health, port: opa-diag}}
          volumeMounts:
            - {name: opa-config, mountPath: /config, readOnly: true}
            - {name: bundle-pubkey, mountPath: /keys, readOnly: true}
            - {name: opa-cache, mountPath: /var/opa}
            - {name: spiffe, mountPath: /spiffe, readOnly: true}  # client certificate for /bundles (ticket 40)
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: mcp-servers, configMap: {name: mcp-servers}}
        - {name: bus, secret: {secretName: mcp-gateway-bus}}
        - {name: opa-config, configMap: {name: opa-config}}
        - {name: bundle-pubkey, configMap: {name: policy-bundle-pubkey}}
        - {name: opa-cache, emptyDir: {}}
        - {name: spiffe, csi: {driver: spiffe.csi.cert-manager.io, readOnly: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  labels: {app: mcp-gateway}
spec:
  selector: {app: mcp-gateway}
  ports: [{port: 80, targetPort: http, name: http}]
