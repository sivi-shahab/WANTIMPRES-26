# Generated shape is identical per service; differences go in overlays.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels: {app: control-plane}
spec:
  replicas: 2
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane, wantimpres26.bank/egress: external}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: registry.local/wantimpres26/control-plane:dev
          imagePullPolicy: Always
          # http: admin API (behind the ingress, OIDC) and probes; mtls: the signed bundle, for OPA sidecars only (ticket 40).
          ports: [{containerPort: 8080, name: http}, {containerPort: 8443, name: mtls}]
          # Secret control-plane (out of band): DATABASE_URL, KAFKA_BROKERS (TLS listener), SCHEMA_REGISTRY_URL, TENANT_ID, TENANT_PEPPER (ticket 37), PUBLIC_URL,
          # OIDC_ISSUER, OIDC_AUDIENCE, OIDC_MFA_ACR, BREAK_GLASS_SUBS, SCIM_TOKEN_SHA256 (ADR-0002), MCP_GATEWAY_TOKEN_SHA256 (tickets 29-30), APPROVAL_TTL, APPROVAL_WEBHOOK_URL (ticket 30),
          # OPENSEARCH_URL (https), OPENSEARCH_USER, OPENSEARCH_PASSWORD (policy simulation reads stored events),
          # CATALOG_FEED_URL + CATALOG_FEED_PUBKEY_FILE (signed AI app catalog feed, ticket 16; optional),
          # BUNDLE_TRANSIT_URL (Vault transit sign endpoint of the HSM-backed bundle key, ticket 40).
          envFrom: [{secretRef: {name: control-plane}}]
          env:
            - {name: INCIDENT_KEK_FILE, value: /kek/incident.kek}
            # Event bus (ticket 41): TLS + SASL/SCRAM as control-plane; files from Secret control-plane-bus (out of band).
            - {name: KAFKA_SASL_USER, value: control-plane}
            - {name: KAFKA_SASL_PASSWORD_FILE, value: /bus/kafka-password}
            - {name: KAFKA_CA_FILE, value: /bus/kafka-ca.crt}
            - {name: OPENSEARCH_CA_FILE, value: /bus/opensearch-ca.crt}
            # Bundle key (ticket 40): signs through Vault transit; the private key never enters the pod.
            # Rotation: docs/runbooks/rotasi-kunci-bundle.md.
            - {name: BUNDLE_SIGNING_KEY_ID, value: wantimpres26-policy-a}
            - {name: BUNDLE_SIGNING_PUBKEY_FILE, value: /keys/wantimpres26-policy-a.pub}
            - {name: BUNDLE_TRANSIT_TOKEN_FILE, value: /vault/secrets/bundle-signer-token}
            - {name: MTLS_DIR, value: /spiffe}
            - {name: MTLS_ALLOW, value: "spiffe://wantimpres26.bank/ns/wantimpres26/sa/ai-gateway,spiffe://wantimpres26.bank/ns/wantimpres26/sa/mcp-gateway"}
          volumeMounts:
            - {name: bundle-pubkey, mountPath: /keys, readOnly: true}
            # Vault token allowed only transit/sign on the bundle key (short TTL, renewed by the Vault agent).
            - {name: bundle-signer-token, mountPath: /vault/secrets, readOnly: true}
            - {name: incident-kek, mountPath: /kek, readOnly: true}
            - {name: bus, mountPath: /bus, readOnly: true}
            - {name: spiffe, mountPath: /spiffe, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: bus, secret: {secretName: control-plane-bus}}
        # wantimpres26-policy-a.pub, wantimpres26-policy-b.pub: public halves of the two bundle key slots.
        - {name: bundle-pubkey, configMap: {name: policy-bundle-pubkey}}
        - {name: bundle-signer-token, secret: {secretName: bundle-signer-token}}
        # 32 random bytes wrapping per-incident evidence keys (KMS/HSM in production).
        - {name: incident-kek, secret: {secretName: incident-kek}}
        # The pod's SPIFFE SVID (cert-manager csi-driver-spiffe, deploy/cluster/workload-identity.md).
        - {name: spiffe, csi: {driver: spiffe.csi.cert-manager.io, readOnly: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector: {app: control-plane}
  ports: [{port: 80, targetPort: http, name: http}, {port: 8443, targetPort: mtls, name: mtls}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels: {app: ai-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ai-gateway}
  template:
    metadata:
      labels: {app: ai-gateway, wantimpres26.bank/egress: external}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: ai-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ai-gateway
          image: registry.local/wantimpres26/ai-gateway:dev
          imagePullPolicy: Always
          # KAFKA_BROKERS (TLS listener), SCHEMA_REGISTRY_URL, TENANT_ID, TENANT_PEPPER, REDIS_URL, VAULT_TOKEN.
          envFrom: [{secretRef: {name: ai-gateway}}]
          env:
            - {name: AIGW_CONFIG_FILE, value: /config/aigw.json}
            - {name: VAULT_URLS, value: http://token-vault}
            # L2 shadow report in decision events (ticket 49): after the decision, at most 150 ms, never on the request path.
            - {name: DETECTION_URL, value: https://detection-svc:8443}
            - {name: MTLS_DIR, value: /spiffe}
            # Event bus (ticket 41): TLS + SASL/SCRAM as ai-gateway; files from Secret ai-gateway-bus (out of band).
            - {name: KAFKA_SASL_USER, value: ai-gateway}
            - {name: KAFKA_SASL_PASSWORD_FILE, value: /bus/kafka-password}
            - {name: KAFKA_CA_FILE, value: /bus/kafka-ca.crt}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: aigw-config, mountPath: /config, readOnly: true}
            # Provider API keys, one file per provider (aigw.json key_file). Written by the Vault agent in
            # production; the gateway re-reads a file when it changes, so rotation needs no restart.
            - {name: provider-keys, mountPath: /vault/secrets, readOnly: true}
            - {name: bus, mountPath: /bus, readOnly: true}
            - {name: spiffe, mountPath: /spiffe, readOnly: true}  # client certificate for detection-svc (ticket 40)
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        # PDP sidecar (FR-POL-1): verifies the Policy Service bundle signature before activating it.
        - name: opa
          image: registry.local/wantimpres26/opa:dev
          imagePullPolicy: Always
          # Ticket 47: fewer GC cycles keep the p99 of a decision under 5 ms on 1 vCPU; the soft memory limit makes
          # the GC work harder again before the 256Mi container limit.
          env:
            - {name: GOGC, value: "800"}
            - {name: GOMEMLIMIT, value: 200MiB}
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181  # only the PEP in this pod may ask for decisions
            - --diagnostic-addr=:8282
            - --config-file=/config/opa.yaml
            # Both key slots (policysvc.KeyIDs): the bundle's kid picks one, so the key rotates without a restart here.
            - --set-file=keys.wantimpres26-policy-a.key=/keys/wantimpres26-policy-a.pub
            - --set-file=keys.wantimpres26-policy-b.key=/keys/wantimpres26-policy-b.pub
            - --optimize-store-for-read-speed
          ports: [{containerPort: 8282, name: opa-diag}]
          # Not ready until a verified bundle is active: no PEP traffic on an empty policy.
          readinessProbe: {httpGet: {path: "/health?bundles", port: opa-diag}}
          livenessProbe: {httpGet: {path: /health, port: opa-diag}}
          volumeMounts:
            - {name: opa-config, mountPath: /config, readOnly: true}
            - {name: bundle-pubkey, mountPath: /keys, readOnly: true}
            - {name: opa-cache, mountPath: /var/opa}
            - {name: spiffe, mountPath: /spiffe, readOnly: true}  # client certificate for /bundles (ticket 40)
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            # Ticket 47: decisions (2 per request) plus masked decision logs cost OPA slightly more CPU than the
            # gateway itself; 2 + 2 vCPU stays within the overhead target up to ~125 RPS per pod.
            limits: {cpu: "2", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: aigw-config, configMap: {name: ai-gateway-config}}
        - {name: provider-keys, secret: {secretName: ai-gateway-provider-keys}}
        - {name: bus, secret: {secretName: ai-gateway-bus}}
        - {name: opa-config, configMap: {name: opa-config}}
        # wantimpres26-policy-a.pub, wantimpres26-policy-b.pub: the bundle key slots (docs/runbooks/rotasi-kunci-bundle.md).
        - {name: bundle-pubkey, configMap: {name: policy-bundle-pubkey}}
        - {name: opa-cache, emptyDir: {}}
        - {name: spiffe, csi: {driver: spiffe.csi.cert-manager.io, readOnly: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  selector: {app: ai-gateway}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-svc
  labels: {app: detection-svc}
spec:
  replicas: 2
  selector:
    matchLabels: {app: detection-svc}
  template:
    metadata:
      labels: {app: detection-svc, wantimpres26.bank/egress: external}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: detection-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: detection-svc
          image: registry.local/wantimpres26/detection-svc:dev
          imagePullPolicy: Always
          # http: probes only; mtls: POST /scan/text for the PEP workloads in MTLS_ALLOW (ticket 40, threat model G1).
          ports: [{containerPort: 8080, name: http}, {containerPort: 8443, name: mtls}]
          # Secret detection-svc (out of band, optional): DATABASE_URL (read-only role on similarity.docs, tuning.models), TENANT_ID,
          # TENANT_PEPPER (same as control-plane) for registered confidential documents (37) and tenant tuning models (38).
          envFrom: [{secretRef: {name: detection-svc, optional: true}}]
          # L2 models (tickets 09-10): shadow first (spec §9.4); enforce after the release gate. model-inference is mTLS-only (ticket 40).
          env:
            - {name: MTLS_DIR, value: /spiffe}
            - {name: MTLS_ALLOW, value: "spiffe://wantimpres26.bank/ns/wantimpres26/sa/ai-gateway,spiffe://wantimpres26.bank/ns/wantimpres26/sa/mcp-gateway"}
            - {name: MODEL_INFERENCE_URL, value: https://model-inference:8443}
            - {name: L2_MODE, value: shadow}
          volumeMounts: [{name: spiffe, mountPath: /spiffe, readOnly: true}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}  # similarity index in memory: ~16 KB per registered 5k-word document
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: spiffe, csi: {driver: spiffe.csi.cert-manager.io, readOnly: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: detection-svc
spec:
  selector: {app: detection-svc}
  ports: [{port: 8443, targetPort: mtls, name: mtls}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-inference
  labels: {app: model-inference}
spec:
  replicas: 2
  selector:
    matchLabels: {app: model-inference}
  template:
    metadata:
      labels: {app: model-inference}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: model-inference
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model-inference
          image: registry.local/wantimpres26/model-inference:dev
          imagePullPolicy: Always
          # http: probes only; mtls: the models, for detection-svc only (ticket 40, services/model-inference/mtls.py).
          # The model comes from the model store (PVC model-store, written by the release job that checks the sha256 in
          # services/model-inference/MODELS.json); never baked into the image.
          ports: [{containerPort: 8080, name: http}, {containerPort: 8443, name: mtls}]
          env:
            - {name: MTLS_DIR, value: /spiffe}
            - {name: MTLS_ALLOW, value: "spiffe://wantimpres26.bank/ns/wantimpres26/sa/detection-svc"}
            - {name: MODEL_DIR, value: /models/l2}
            - {name: ORT_THREADS, value: "2"}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: spiffe, mountPath: /spiffe, readOnly: true}
          resources:
            requests: {cpu: "2", memory: 768Mi}
            limits: {cpu: "2", memory: 1Gi}  # int8 encoder ~135 MB + tokenizer + trigram LM; 2 cores = ORT_THREADS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: spiffe, csi: {driver: spiffe.csi.cert-manager.io, readOnly: true}}
        - name: models
          persistentVolumeClaim: {claimName: model-store, readOnly: true}
---
apiVersion: v1
kind: Service
metadata:
  name: model-inference
spec:
  selector: {app: model-inference}
  ports: [{port: 8443, targetPort: mtls, name: mtls}]
---
# Tokenization vault (ticket 24): two replicas, active-passive. Only the replica holding the Postgres advisory lock is
# ready, so the Service routes to it; the other takes over when it dies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-vault
  labels: {app: token-vault}
spec:
  replicas: 2
  selector:
    matchLabels: {app: token-vault}
  template:
    metadata:
      labels: {app: token-vault, wantimpres26.bank/egress: external}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: token-vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: token-vault
          image: registry.local/wantimpres26/token-vault:dev
          imagePullPolicy: Always
          # DATABASE_URL, TENANT_ID, VAULT_CLIENT_TOKEN_SHA256.
          envFrom: [{secretRef: {name: token-vault}}]
          env:
            - {name: VAULT_KEK_FILE, value: /kek/vault.kek}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: vault-kek, mountPath: /kek, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        # 32 raw bytes, provisioned out of band (Vault/HSM-backed in production). Never in git.
        - {name: vault-kek, secret: {secretName: token-vault-kek}}
---
apiVersion: v1
kind: Service
metadata:
  name: token-vault
spec:
  selector: {app: token-vault}
  ports: [{port: 80, targetPort: http, name: http}]
