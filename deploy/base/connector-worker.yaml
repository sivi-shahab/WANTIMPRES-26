# Data-at-rest discovery (spec §4.3, ticket 31): the M365 connector worker and the Tika extraction service.
# Both parse untrusted files, so both run under gVisor (RuntimeClass "gvisor", provided by the cluster) as
# non-root with read-only roots. Tika gets no egress and only the worker may reach it.
# Secret connector-worker (out of band): DATABASE_URL, TENANT_PEPPER, LABELS, SCAN_INTERVAL, and the variables of
# each source in use (cmd/connector-worker): M365_*, GDRIVE_ADMIN + GDRIVE_DOMAINS, S3_*, GCS_HMAC_*, AZURE_BLOB_*,
# CLAUDE_COMPLIANCE_KEY, CHATGPT_COMPLIANCE_KEY + CHATGPT_WORKSPACE, EVENTS_TOKEN_SHA256, TENANT_ID; remediation
# write credentials (ticket 33), separate from the read-only scan ones: M365_REMEDIATE_CLIENT_ID/SECRET,
# GDRIVE_REMEDIATE=true, S3_REMEDIATE_ACCESS_KEY/SECRET_KEY + S3_QUARANTINE_BUCKET.
# Secret connector-worker-files (optional): gdrive-key.json (service account with domain-wide delegation).
# Bucket notifications (MinIO/S3 webhook, GCS Pub/Sub push, Azure Event Grid) POST to
# http(s)://<ingress>/events/{s3|gcs|azure}?token=… → Service connector-worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-worker
  labels: {app: connector-worker}
spec:
  replicas: 2  # containers are locked per worker (advisory lock), so replicas split the work
  selector:
    matchLabels: {app: connector-worker}
  template:
    metadata:
      labels: {app: connector-worker, wantimpres26.bank/egress: external}
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      serviceAccountName: connector-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: connector-worker
          image: registry.local/wantimpres26/connector-worker:dev
          imagePullPolicy: Always
          envFrom: [{secretRef: {name: connector-worker}}]
          env:
            - {name: TIKA_URL, value: "http://tika:9998"}
            - {name: GDRIVE_KEY_FILE, value: /secrets/gdrive-key.json}
          ports: [{containerPort: 8080, name: http}]  # /healthz, POST /events/{source}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}  # one 50 MB file plus its extraction in memory
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: files, mountPath: /secrets, readOnly: true}]
      volumes:
        - {name: files, secret: {secretName: connector-worker-files, optional: true}}
---
apiVersion: v1
kind: Service
metadata:
  name: connector-worker
spec:
  selector: {app: connector-worker}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  labels: {app: tika}
spec:
  replicas: 2
  selector:
    matchLabels: {app: tika}
  template:
    metadata:
      labels: {app: tika}
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      serviceAccountName: tika
      securityContext:
        runAsNonRoot: true
        runAsUser: 35002
        runAsGroup: 35002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tika
          image: registry.local/wantimpres26/tika:dev  # upstream Tika re-signed by CI (build/tika.Dockerfile)
          imagePullPolicy: Always
          ports: [{containerPort: 9998, name: http}]
          readinessProbe: {httpGet: {path: /tika, port: http}}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: tika
spec:
  selector: {app: tika}
  ports: [{port: 9998, targetPort: http, name: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tika-isolated
spec:
  podSelector: {matchLabels: {app: tika}}
  policyTypes: [Ingress, Egress]
  ingress:
    # The worker, and the control-plane registering confidential PDFs (ticket 37, TIKA_URL).
    - from: [{podSelector: {matchLabels: {app: connector-worker}}}, {podSelector: {matchLabels: {app: control-plane}}}]
      ports: [{port: 9998}]
  egress: []  # a parser exploit has nowhere to call
