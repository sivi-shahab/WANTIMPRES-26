# Alerts for wantimpres26 (prometheus-operator). OPA keeps serving the last verified bundle, so a rejected
# bundle is silent for traffic: these make it loud. Scraped from each sidecar's :8282/metrics.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-policy-bundle
  namespace: wantimpres26
spec:
  groups:
    - name: policy-bundle
      rules:
        # Security event (spec §12.3): someone served a bundle not signed by the Policy Service key, or altered one.
        # OPA reports every load error as code=bundle_error, so match the verification messages.
        - alert: PolicyBundleSignatureInvalid
          expr: >-
            sum by (namespace, pod) (increase(bundle_failed_load_counter{name="wantimpres26",
            message=~".*(signature|digest mismatch|verif|signatures.json).*"}[5m])) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: OPA in {{ $labels.pod }} rejected a policy bundle that failed signature verification
        - alert: PolicyBundleLoadFailing
          expr: sum by (namespace, pod) (increase(bundle_failed_load_counter{name="wantimpres26"}[15m])) > 3
          labels: {severity: warning}
          annotations:
            summary: OPA in {{ $labels.pod }} keeps failing to load the policy bundle; still on the last verified one
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-audit-anchor
  namespace: wantimpres26
spec:
  groups:
    - name: audit-anchor
      rules:
        # A day without a WORM anchor leaves its tail of the audit chain unprotected (FR-COMP-4). Needs kube-state-metrics.
        - alert: AuditAnchorMissing
          expr: time() - kube_cronjob_status_last_successful_time{namespace="wantimpres26", cronjob="audit-anchor"} > 26 * 3600
          labels: {severity: critical, category: security}
          annotations:
            summary: No successful daily audit anchor in the last 26 hours
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-event-pipeline
  namespace: wantimpres26
spec:
  groups:
    - name: event-pipeline
      rules:
        # A PEP put raw content (or an unredacted identifier) into an event: privacy bug at the source (spec §10.2).
        - alert: EventsWithRawContent
          expr: sum(increase(events_rejected_total{reason=~"raw_content|unredacted_snippet"}[5m])) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: decision events carrying raw content were rejected; find the PEP emitting them
        - alert: EventsRejected
          expr: sum by (reason) (increase(events_rejected_total{reason!~"raw_content|unredacted_snippet"}[15m])) > 0
          labels: {severity: warning}
          annotations:
            summary: "decision events rejected ({{ $labels.reason }}): PEP and schema out of step?"
        # Ticket 46: gateways keep serving through a Kafka outage, but these decisions are missing from the record.
        - alert: DecisionEventsDropped
          expr: sum by (namespace, pod) (increase(decision_events_dropped_total[5m])) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: "{{ $labels.pod }} could not deliver decision events to Kafka; the audit trail has a gap"
        - alert: EventIngestLagging
          expr: sum(kafka_consumer_lag{group="event-ingest"}) > 10000
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: event-ingest is falling behind; events may not be searchable within 60 s
        # SLO: searchable <= 60 s p95; indexing delay plus the 5 s refresh_interval.
        - alert: EventSearchSLOBreached
          expr: histogram_quantile(0.95, sum by (le) (rate(event_index_delay_seconds_bucket[10m]))) > 55
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: p95 produce-to-index delay above 55 s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-incidents
  namespace: wantimpres26
spec:
  groups:
    - name: incidents
      rules:
        # FR-INC-7: critical acknowledged <= 15 min, high <= 1 h. Scraped from control-plane /metrics.
        - alert: IncidentAckOverdue
          expr: max(incident_ack_overdue) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: "{{ $value }} incident(s) past their acknowledge SLA"
        # Ticket 45 (threat model G6): an analyst unmasking far more evidence than triage needs, or looking up the
        # same person again and again. Gauges over the last 24 h from control-plane /metrics; tune thresholds here.
        - alert: UnmaskVolumeHigh
          expr: max by (analyst) (evidence_unmasks_24h) > 20
          labels: {severity: warning, category: security}
          annotations:
            summary: "{{ $labels.analyst }} unmasked {{ $value }} pieces of evidence in 24 h"
        - alert: UnmaskSamePrincipalRepeated
          expr: max by (analyst) (evidence_unmask_same_principal_24h) >= 5
          labels: {severity: warning, category: security}
          annotations:
            summary: "{{ $labels.analyst }} unmasked evidence about one person {{ $value }} times in 24 h"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-identity
  namespace: wantimpres26
spec:
  groups:
    - name: identity
      rules:
        # Spec §10.1: break-glass is audited; any use pages, so it is never quiet.
        - alert: BreakGlassUsed
          expr: sum(increase(breakglass_requests_total[5m])) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: the break-glass account is in use; confirm the emergency and review the audit log
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-policy-lifecycle
  namespace: wantimpres26
spec:
  groups:
    - name: policy-lifecycle
      rules:
        # Spec §13: publish/rollback reaches every PEP within 60 s. Replicas serving different releases for over a
        # minute means one stopped following (NOTIFY and poll both failing).
        - alert: PolicyReleaseDiverged
          expr: max(policy_release_current) - min(policy_release_current) > 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: control-plane replicas serve different policy releases
        # FR-POL-7: owners are told 7 days ahead (audit entry policy.exception.expiring, forwarded to the SIEM).
        - alert: PolicyExceptionsExpiring
          expr: max(policy_exceptions_expiring) > 0
          labels: {severity: info}
          annotations:
            summary: "{{ $value }} policy exception(s) expire within 7 days"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-siem-export
  namespace: wantimpres26
spec:
  groups:
    - name: siem-export
      rules:
        # Records the SIEM never got: replay from topic wantimpres26.siem.dlq.v1 once the cause is fixed.
        - alert: SIEMRecordsDeadLettered
          expr: sum by (sink) (increase(siem_records_dead_lettered_total[15m])) > 0
          labels: {severity: warning}
          annotations:
            summary: "SIEM export dead-lettered records for sink {{ $labels.sink }}"
        # Security telemetry (policy changes, unmask, break-glass) waiting to reach the SIEM.
        - alert: SIEMAuditExportLagging
          expr: max(siem_audit_lag) > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} audit entries not yet exported to the SIEM for 15 minutes"
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wantimpres26-ai-gateway
  namespace: wantimpres26
spec:
  groups:
    - name: ai-gateway
      rules:
        # Spec §13.3: a fail_open app reached a provider without a policy decision.
        - alert: AIGatewayFailOpen
          expr: sum by (app) (increase(aigw_fail_open_total[5m])) > 0
          labels: {severity: critical, category: security}
          annotations:
            summary: "AI gateway forwarded {{ $value }} request(s)/response(s) of app {{ $labels.app }} without a policy decision"
        # Ticket 48: Redis unreachable, so rate limits and token quotas only count per replica (N replicas = N× limit).
        - alert: AIGatewayRateCounterDegraded
          expr: sum by (namespace, pod) (increase(aigw_rate_counter_unavailable_total[5m])) > 0
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.pod }} cannot reach Redis; rate limits and quotas are enforced per replica only"
        - alert: AIGatewayFailClosed
          expr: sum by (app) (increase(aigw_fail_closed_total[5m])) > 0
          labels: {severity: warning}
          annotations:
            summary: "AI gateway refused traffic of app {{ $labels.app }}: the PDP is unavailable"
