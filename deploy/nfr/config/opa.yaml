# Harness OPA config: the same bundle settings as deploy/base/opa/opa.yaml (signature verified, last bundle
# persisted), but the bundle comes over plain HTTP from the harness file server (no SPIFFE in docker compose).
services:
  policy:
    url: http://t21-bundles:8000
bundles:
  wantimpres26:
    service: policy
    resource: wantimpres26.tar.gz
    persist: true
    signing:
      exclude_files: []
    polling:
      min_delay_seconds: 10
      max_delay_seconds: 20
keys:
  wantimpres26-policy-a:
    algorithm: ES256
persistence_directory: /var/opa
# As deploy/base/opa/opa.yaml: every decision is masked and logged, part of the cost per decision (ticket 47).
decision_logs:
  console: true
  mask_decision: /system/log/mask
