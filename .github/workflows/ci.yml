# GitHub mirror of .gitlab-ci.yml lint → test → scan. Tool versions match the GitLab images, except MinIO: Docker Hub
# and quay no longer serve minio/minio, so this uses Chainguard's build (GitLab pulls the pinned release from the mirror).
# Actions are pinned by commit SHA.
# Build, SBOM and signing stay on GitLab: they push to the internal registry and sign with the protected key (ADR-0001).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with: {version: v2.14.0}

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/astral-sh/ruff:0.14.0-alpine ruff check services
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/astral-sh/ruff:0.14.0-alpine ruff format --check services

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go-cache
          key: go-${{ hashFiles('go.sum') }}
      # Same backends and aliases as the GitLab job. They are started by hand because Actions service containers
      # cannot take a command (minio, karapace, azurite need one), and the tests run on the same network.
      - name: Start integration backends
        run: |
          docker network create ci
          run() { docker run -d --network ci --name "$@" >/dev/null; }
          run postgres -e POSTGRES_PASSWORD=test postgres:17
          run minio -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio-test-only \
            cgr.dev/chainguard/minio@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7 server /tmp/data
          run kafka \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,SASL://:9094 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,SASL://kafka:9094 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT \
            -e KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer \
            -e 'KAFKA_SUPER_USERS=User:admin;User:ANONYMOUS' \
            -e KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS=PLAIN,SCRAM-SHA-512 \
            -e 'KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin-test-only";' \
            -e 'KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required;' \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            apache/kafka:3.9.0
          run karapace -e KARAPACE_BOOTSTRAP_URI=kafka:9092 -e KARAPACE_HOST=0.0.0.0 -e KARAPACE_PORT=8081 \
            -e KARAPACE_REPLICATION_FACTOR=1 ghcr.io/aiven-open/karapace:5.0.3 python3 -m karapace
          run opensearch -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true -e 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m' \
            opensearchproject/opensearch:2.19.3
          run azurite mcr.microsoft.com/azure-storage/azurite:3.35.0 azurite-blob --blobHost 0.0.0.0 --loose
      - name: Wait for backends
        run: |
          docker run --rm --network ci curlimages/curl:8.10.1 sh -c '
            for u in http://karapace:8081/subjects http://opensearch:9200 http://minio:9000/minio/health/live; do
              curl -sf --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null "$u" || { echo "not up: $u"; exit 1; }
            done'
          for _ in $(seq 60); do docker exec postgres pg_isready -U postgres -q && break; sleep 2; done
      - name: go vet + go test -race
        run: |
          mkdir -p ~/go-cache
          docker run --rm --network ci -v "$PWD:/src" -w /src -v ~/go-cache:/go/pkg/mod \
            -e IT_KAFKA_BROKERS=kafka:9092 -e IT_KAFKA_SASL_BROKERS=kafka:9094 -e IT_KAFKA_ADMIN_PASSWORD=admin-test-only \
            -e IT_SCHEMA_REGISTRY_URL=http://karapace:8081 -e IT_OPENSEARCH_URL=http://opensearch:9200 \
            -e AUDIT_TEST_DATABASE_URL=postgres://postgres:test@postgres:5432/postgres \
            -e AUDIT_TEST_S3_ENDPOINT=minio:9000 -e AUDIT_TEST_S3_ACCESS_KEY=minio -e AUDIT_TEST_S3_SECRET_KEY=minio-test-only \
            -e OBJSTORE_TEST_AZURITE=http://azurite:10000/devstoreaccount1 \
            golang:1.26 sh -c 'go vet ./... && go test -race ./...'
      - name: Backend logs on failure
        if: failure()
        run: for c in postgres minio kafka karapace opensearch azurite; do echo "== $c"; docker logs --tail 50 "$c" 2>&1; done

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.11"}
      - working-directory: services/model-inference
        run: pip install --no-cache-dir -r requirements.txt && python -m unittest -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # testdata/pki: the test-only mTLS fixture PKI, same exception as .gitleaks.toml.
      - run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0 semgrep scan --config p/default --metrics=off --error --exclude services/model-inference/testdata/pki

  sca-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          trivy() { docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.67.2 "$@"; }
          trivy fs --scanners vuln,license --severity HIGH,CRITICAL --exit-code 1 .
          trivy config --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}  # whole history, not just the tip
      # safe.directory: the checkout is owned by the runner user, not the container's.
      - run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.28.0 git --redact --verbose .
