# Publishes the VitePress docs site (docs/) to GitHub Pages, with the newest interactive architecture
# diagram (.archify/architecture-wantimpres26-platform-*) at /architecture/.
name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.scratch/ai-data-security/**', '.archify/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}  # full history for the "last updated" dates
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: {node-version: 22, cache: npm}
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
      # Folder names end in a timestamp, so the last one in sort order is the newest.
      - run: |
          dir=$(find .archify -maxdepth 1 -type d -name 'architecture-wantimpres26-platform-*' | sort | tail -n 1)
          mkdir -p docs/.vitepress/dist/architecture
          cp "$dir/wantimpres26-platform.html" docs/.vitepress/dist/architecture/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: {path: docs/.vitepress/dist}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
