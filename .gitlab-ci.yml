# Pipeline (spec §12.2): lint → unit → SAST → SCA → secret scan → IaC scan → build distroless → SBOM → sign.
# On-prem only (ADR-0001): tool images MUST come from the internal mirror; cosign never talks to public Rekor/Fulcio.
# Not yet here: SLSA provenance, integration/adversarial suites, deploy + canary (their own tickets).

variables:
  MIRROR: ""  # e.g. "registry.bank.local/mirror/" — set at group level so every image below is pulled internally
  GO_IMAGE: ${MIRROR}golang:1.26
  LINT_GO_IMAGE: ${MIRROR}golangci/golangci-lint:v2.14.0
  RUFF_IMAGE: ${MIRROR}ghcr.io/astral-sh/ruff:0.14.0-alpine
  PYTHON_IMAGE: ${MIRROR}python:3.11-slim  # matches distroless python3-debian12
  SEMGREP_IMAGE: ${MIRROR}semgrep/semgrep:1.140.0
  TRIVY_IMAGE: ${MIRROR}aquasec/trivy:0.67.2
  GITLEAKS_IMAGE: ${MIRROR}zricethezav/gitleaks:v8.28.0
  BUILDKIT_IMAGE: ${MIRROR}moby/buildkit:v0.25.1-rootless
  COSIGN_IMAGE: ${MIRROR}ghcr.io/sigstore/cosign/cosign:v3.0.2-dev
  IMAGE_BASE: $CI_REGISTRY_IMAGE

stages: [lint, test, scan, build, publish, sign]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.services: &services
  parallel:
    matrix:
      - SERVICE: [control-plane, ai-gateway, detection-svc, event-ingest, siem-export, mcp-gateway, connector-worker, token-vault]
        DOCKERFILE: build/go.Dockerfile
      - SERVICE: model-inference
        DOCKERFILE: services/model-inference/Dockerfile
      - SERVICE: opa  # upstream OPA, re-signed so Kyverno admits the PDP sidecar
        DOCKERFILE: build/opa.Dockerfile
      - SERVICE: tika  # upstream Tika server, re-signed (file extraction, ticket 31)
        DOCKERFILE: build/tika.Dockerfile

lint:go:
  stage: lint
  image: $LINT_GO_IMAGE
  script:
    - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - golangci-lint run ./...

lint:python:
  stage: lint
  image: $RUFF_IMAGE
  script:
    - ruff check services
    - ruff format --check services

test:go:
  stage: test
  image: $GO_IMAGE
  # Integration tests fail, not skip, under CI: audit log (Postgres + S3 object lock) and the event pipeline
  # (Kafka + schema registry + OpenSearch, internal/ingest).
  services:
    - {name: "${MIRROR}postgres:17", alias: postgres}
    - {name: "${MIRROR}minio/minio:RELEASE.2024-06-13T22-53-53Z", alias: minio, command: [server, /data]}
    - {name: "${MIRROR}apache/kafka:3.9.0", alias: kafka}
    - {name: "${MIRROR}ghcr.io/aiven-open/karapace:5.0.3", alias: karapace, command: [python3, -m, karapace]}
    - {name: "${MIRROR}opensearchproject/opensearch:2.19.3", alias: opensearch}
    # Azure Blob emulator for the object-storage connector contract test (ticket 32).
    - {name: "${MIRROR}mcr.microsoft.com/azure-storage/azurite:3.35.0", alias: azurite, command: [azurite-blob, --blobHost, 0.0.0.0, --loose]}
  variables:
    FF_NETWORK_PER_BUILD: "true"  # services reach each other by alias (karapace -> kafka)
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: broker,controller
    # PLAINTEXT (anonymous = super user) for the pipeline tests; SASL with the authorizer for the ACL test (ticket 41).
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,SASL://:9094
    KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL://kafka:9094
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT
    KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
    KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
    KAFKA_LISTENER_NAME_SASL_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-512
    KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required user_admin="admin-test-only";
    KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KARAPACE_BOOTSTRAP_URI: kafka:9092
    KARAPACE_HOST: 0.0.0.0
    KARAPACE_PORT: "8081"
    KARAPACE_REPLICATION_FACTOR: "1"
    discovery.type: single-node
    DISABLE_SECURITY_PLUGIN: "true"
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    IT_KAFKA_BROKERS: kafka:9092
    IT_KAFKA_SASL_BROKERS: kafka:9094
    IT_KAFKA_ADMIN_PASSWORD: admin-test-only
    IT_SCHEMA_REGISTRY_URL: http://karapace:8081
    IT_OPENSEARCH_URL: http://opensearch:9200
    POSTGRES_PASSWORD: test
    MINIO_ROOT_USER: minio
    MINIO_ROOT_PASSWORD: minio-test-only
    AUDIT_TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/postgres
    AUDIT_TEST_S3_ENDPOINT: minio:9000
    AUDIT_TEST_S3_ACCESS_KEY: minio
    AUDIT_TEST_S3_SECRET_KEY: minio-test-only
    OBJSTORE_TEST_AZURITE: http://azurite:10000/devstoreaccount1
  script:
    - go vet ./...
    - go test -race ./...  # includes the shared privacy test (internal/privacy)

test:python:
  stage: test
  image: $PYTHON_IMAGE
  script:
    - cd services/model-inference && pip install --no-cache-dir -r requirements.txt && python -m unittest -v

sast:
  stage: scan
  image: $SEMGREP_IMAGE
  script:
    # testdata/pki: the test-only mTLS fixture PKI, same exception as .gitleaks.toml.
    - semgrep scan --config p/default --metrics=off --error --exclude services/model-inference/testdata/pki

sca:
  stage: scan
  image: $TRIVY_IMAGE
  script:
    # Vulnerabilities + licenses in go.mod / Python deps. Forbidden licenses are CRITICAL.
    - trivy fs --scanners vuln,license --severity HIGH,CRITICAL --exit-code 1 .

secrets:
  stage: scan
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  variables: { GIT_DEPTH: 0 }  # whole history, not just the tip
  script:
    - gitleaks git --redact --verbose .

iac:
  stage: scan
  image: $TRIVY_IMAGE
  script:
    - trivy config --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --exit-code 1 .

build:
  stage: build
  image: { name: $BUILDKIT_IMAGE, entrypoint: [""] }
  <<: *services
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - mkdir -p ~/.docker digests
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > ~/.docker/config.json
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0 --local context=. --local dockerfile=.
      --opt filename=$DOCKERFILE --opt build-arg:SERVICE=$SERVICE
      --output type=image,name=$IMAGE_BASE/$SERVICE:$CI_COMMIT_SHORT_SHA,push=true
      --metadata-file meta.json
    - |
      sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' meta.json > digests/$SERVICE
    - test -s digests/$SERVICE
  artifacts:
    paths: [digests/]

sbom:
  stage: publish
  image: { name: $TRIVY_IMAGE, entrypoint: [""] }
  <<: *services
  needs: [build]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - REF="$IMAGE_BASE/$SERVICE@$(cat digests/$SERVICE)"
    - mkdir -p sbom
    - trivy image --format cyclonedx --output sbom/$SERVICE.cdx.json "$REF"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 "$REF"
  artifacts:
    paths: [sbom/, digests/]

sign:
  stage: sign
  image: { name: $COSIGN_IMAGE, entrypoint: [""] }
  <<: *services
  needs: [sbom]
  rules:
    # Signing key is a protected variable: only the default branch can sign.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # COSIGN_KEY: protected file variable, or a KMS/HSM URI (hashivault://..., pkcs11:...). COSIGN_PASSWORD likewise.
    COSIGN_YES: "true"
  script:
    - REF="$IMAGE_BASE/$SERVICE@$(cat digests/$SERVICE)"
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    # No public Rekor (ADR-0001). Legacy .sig/.att tags: Kyverno 1.19 does not read cosign v3 bundles.
    - SIGN="--key $COSIGN_KEY --tlog-upload=false --new-bundle-format=false --use-signing-config=false"
    - cosign sign $SIGN "$REF"
    - cosign attest $SIGN --type cyclonedx --predicate sbom/$SERVICE.cdx.json "$REF"
    # Admission only checks the signature (see deploy/cluster/require-signed-images.yaml), so verify the SBOM here.
    - cosign public-key --key "$COSIGN_KEY" > cosign.pub
    - cosign verify-attestation --key cosign.pub --insecure-ignore-tlog --type cyclonedx "$REF" > /dev/null
